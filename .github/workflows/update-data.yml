name: 每日更新事件資料

on:
  schedule:
    # UTC 22:00 = 台北早上 06:00（美股收盤後）
    - cron: "0 22 * * *"
  workflow_dispatch:        # 也可以手動按一下就跑

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取排程與價格
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/fetch_events.py

      - name: 有變動才 commit
        run: |
          git config user.name  "event-calendar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "資料沒變動，跳過。"
          else
            git commit -m "chore: 更新事件資料 $(date -u +%Y-%m-%d)"
            git push
          fi
